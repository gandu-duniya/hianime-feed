name: hianime-feed

on:
  schedule:
    - cron: "*/10 * * * *"  # Runs every 10 minutes
  workflow_dispatch:         # Allows you to still run it manually anytime

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python hianime.py
        env:
          ANIME_WEBHOOK: ${{ secrets.ANIME_WEBHOOK }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add hianime_sent.txt
          git commit -m "update hianime state" || exit 0
          git pull --rebase
          git push
